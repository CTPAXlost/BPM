name: pokolenie_vpn
description: WARP and AmneziaWG client with automatic in-app profile generation.
publish_to: none
version: 1.1.1+111

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5
  http: 1.5.0
  shared_preferences: 2.5.3
  crypto: 3.0.6
  file_selector: 1.1.0
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/warp/
