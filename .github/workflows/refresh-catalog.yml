name: Refresh public VPN catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-pokolenie-catalog
  cancel-in-progress: true

jobs:
  refresh:
    name: Validate fresh catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh and prefilter
        run: python tools/catalog_builder.py --sources catalog/sources.json --output catalog/public_catalog.json --max-per-protocol 50 --timeout 2.5
      - name: Validate generated catalog
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('catalog/public_catalog.json').read_text(encoding='utf-8'))
          nodes = data.get('nodes', [])
          counts = data.get('counts', {})
          whitelist_counts = data.get('whitelist_counts', {})
          if not nodes:
              raise SystemExit('Generated catalog is empty')
          regular = {key: value for key, value in counts.items() if key != 'whitelist'}
          if any(int(value) > 50 for value in regular.values()):
              raise SystemExit(f'Protocol limit exceeded: {counts}')
          if any(int(value) > 50 for value in whitelist_counts.values()):
              raise SystemExit(f'Whitelist subtype limit exceeded: {whitelist_counts}')
          print(f'Validated nodes: {len(nodes)}')
          print(f'Counts: {counts}')
          print(f'Whitelist counts: {whitelist_counts}')
      - name: Publish catalog to main
        run: |
          if git diff --quiet -- catalog/public_catalog.json; then
            echo "Catalog is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/public_catalog.json
          git commit -m "chore: refresh public VPN catalog"
          git push
      - name: Upload hourly validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-hourly-catalog-check
          path: catalog/public_catalog.json
          if-no-files-found: error
          retention-days: 3
