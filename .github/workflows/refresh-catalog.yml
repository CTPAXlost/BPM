name: Refresh public VPN catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# The catalog is validated every hour but is no longer committed to main.
# Fresh profiles are still generated for every APK build and refreshed
# inside the application at startup, on schedule, and by the update button.
permissions:
  contents: read

concurrency:
  group: refresh-pokolenie-catalog
  cancel-in-progress: true

jobs:
  refresh:
    name: Validate fresh catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh and prefilter
        run: python tools/catalog_builder.py --sources catalog/sources.json --output catalog/public_catalog.json --max-per-protocol 50 --timeout 2.5
      - name: Validate generated catalog
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('catalog/public_catalog.json').read_text(encoding='utf-8'))
          nodes = data.get('nodes', [])
          counts = data.get('counts', {})
          if not nodes:
              raise SystemExit('Generated catalog is empty')
          if any(int(value) > 50 for value in counts.values()):
              raise SystemExit(f'Protocol limit exceeded: {counts}')
          print(f'Validated nodes: {len(nodes)}')
          print(f'Counts: {counts}')
      - name: Upload hourly validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-hourly-catalog-check
          path: catalog/public_catalog.json
          if-no-files-found: error
          retention-days: 3
