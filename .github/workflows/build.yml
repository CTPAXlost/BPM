name: Build Pokolenie WARP Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: pokolenie-warp-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  AMNEZIAWG_ANDROID_VERSION: '2.0.1'

jobs:
  preflight:
    name: WARP-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python tools/validate_source.py
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded

  android:
    name: Android arm64 APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch official AmneziaWG Android core
        run: |
          git clone --depth 1 --branch "${{ env.AMNEZIAWG_ANDROID_VERSION }}" --recurse-submodules --shallow-submodules https://github.com/amnezia-vpn/amneziawg-android third_party/amneziawg-android
          test -f third_party/amneziawg-android/tunnel/src/main/java/org/amnezia/awg/backend/GoBackend.java
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter create . --platforms=android --org app.pokolenie --project-name pokolenie_vpn
      - run: python tools/prepare_android.py
      - run: python tools/validate_source.py --allow-generated
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded
      - run: flutter build apk --release --target-platform android-arm64
      - name: Verify WARP-only APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 104857600
          unzip -l "$APK" > build/apk-files.txt
          grep -E 'lib/arm64-v8a/lib(wg-go|wg|wg-quick)\.so' build/apk-files.txt
          ! grep -Ei '(libbox|singbox|sing-box)' build/apk-files.txt
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Pokolenie-WARP-Android-arm64.apk
          sha256sum dist/Pokolenie-WARP-Android-arm64.apk > dist/Pokolenie-WARP-Android-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pokolenie-WARP-Android
          path: dist/*
          if-no-files-found: error
