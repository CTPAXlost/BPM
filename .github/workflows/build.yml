name: Build Pokolenie WARP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: pokolenie-warp-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  AMNEZIAWG_ANDROID_VERSION: '2.0.1'
  # Official 2.0.0 explicitly keeps AWG 1.5 parameter compatibility while
  # carrying the newer Windows/Wintun integration required by current Win11.
  AMNEZIAWG_WINDOWS_VERSION: '2.0.0'

jobs:
  preflight:
    name: WARP-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python tools/validate_source.py
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded

  android:
    name: Android arm64 APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch official AmneziaWG Android core
        run: |
          git clone --depth 1 --branch "${{ env.AMNEZIAWG_ANDROID_VERSION }}" --recurse-submodules --shallow-submodules https://github.com/amnezia-vpn/amneziawg-android third_party/amneziawg-android
          test -f third_party/amneziawg-android/tunnel/src/main/java/org/amnezia/awg/backend/GoBackend.java
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter create . --platforms=android --org app.pokolenie --project-name pokolenie_vpn
      - run: python tools/prepare_android.py
      - run: python tools/validate_source.py --allow-generated
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded
      - run: flutter build apk --release --target-platform android-arm64
      - name: Verify WARP-only APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 104857600
          unzip -l "$APK" > build/apk-files.txt
          grep -E 'lib/arm64-v8a/lib(wg-go|wg|wg-quick)\.so' build/apk-files.txt
          ! grep -Ei '(libbox|singbox|sing-box)' build/apk-files.txt
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Pokolenie-WARP-Android-arm64.apk
          sha256sum dist/Pokolenie-WARP-Android-arm64.apk > dist/Pokolenie-WARP-Android-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pokolenie-WARP-Android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Windows host project
        run: flutter create . --platforms=windows --org app.pokolenie --project-name pokolenie_vpn
      - name: Apply Pokolenie Windows branding and safety checks
        run: |
          python tools/prepare_windows.py
          python tools/validate_source.py --allow-generated
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded
      - run: flutter build windows --release
      - name: Embed official AmneziaWG x64 tunnel runtime
        shell: pwsh
        run: |
          $version = '${{ env.AMNEZIAWG_WINDOWS_VERSION }}'
          $uri = "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/download/$version/amneziawg-amd64-$version.msi"
          $msi = Join-Path $env:RUNNER_TEMP 'amneziawg-runtime.msi'
          $stage = Join-Path $env:RUNNER_TEMP 'amneziawg-runtime-stage'
          Invoke-WebRequest -Uri $uri -OutFile $msi
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne 'Valid') {
            throw "Official AmneziaWG MSI signature is not valid: $($signature.Status)"
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $process = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$stage") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Unable to extract official AmneziaWG MSI: exit code $($process.ExitCode)"
          }
          $engine = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter amneziawg.exe | Select-Object -First 1
          if ($null -eq $engine) {
            throw 'amneziawg.exe was not found in the official MSI.'
          }
          $runtime = 'build/windows/x64/runner/Release/runtime/amneziawg'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item -Path (Join-Path $engine.Directory.FullName '*') -Destination $runtime -Recurse -Force
          Copy-Item -LiteralPath 'docs/licenses/AMNEZIAWG-WINDOWS-MIT.txt' -Destination (Join-Path $runtime 'LICENSE.txt')
          Get-ChildItem -LiteralPath $runtime -File | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $runtime 'SHA256SUMS.txt') -Encoding ascii
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'awg.exe'))) {
            throw 'awg.exe was not found in the embedded runtime.'
          }
      - name: Build Pokolenie WARP installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath docs/NATIVE_PORTS.md -Destination build/windows/x64/runner/Release/TECHNICAL-NOTES.md
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup 6 is missing on the GitHub Windows runner.'
          }
          $env:POKOLENIE_RELEASE_DIR = (Resolve-Path -LiteralPath 'build/windows/x64/runner/Release').Path
          $env:POKOLENIE_OUTPUT_DIR = (Resolve-Path -LiteralPath 'dist').Path
          $env:POKOLENIE_APP_VERSION = '1.2.2'
          $env:POKOLENIE_ICON_FILE = (Resolve-Path -LiteralPath 'windows/runner/resources/app_icon.ico').Path
          & $iscc 'tools/windows_installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = 'dist/Pokolenie-WARP-Windows-x64-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'Windows Setup artifact is missing.' }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash | Set-Content -LiteralPath dist/Pokolenie-WARP-Windows-x64-Setup.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Pokolenie-WARP-Windows
          path: dist/*
          if-no-files-found: error
